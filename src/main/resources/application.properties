spring.application.name=url-shortener

# Database Connection Settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/url-shortener-db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:user}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: Show SQL queries in the console logs
spring.jpa.show-sql=true